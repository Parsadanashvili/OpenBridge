<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenBridge AI</title>
<style>
:root{color-scheme:light}
:root{--bg:#ffffff;--card:#fff;--line:#e7e5e0;--tx:#1c1b19;--mut:#6b6a66;--ac:#2f6fdc;--ok:#1a7f3c;--warn:#8a5a00;--bad:#b42323;--okbg:#d9f2df;--warnbg:#fbe7b8;--badbg:#fbd5d5}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0}nav button{background:none;border:0;color:var(--mut);padding:8px 12px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
nav button.on{color:var(--tx);border-color:var(--ac)}main{padding:14px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.kpi b{display:block;font-size:30px}.kpi .t{font-size:13px}.kpi .t.ok{color:var(--ok)}.kpi .t.bad{color:var(--bad)}h2{font-size:17px;margin:22px 0 8px}.prob{border-left:4px solid var(--bad)}.prob.m{border-color:var(--warn)}.fix{color:var(--mut);border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.ep{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,monospace}.leg span{margin-right:14px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
button.run{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}button.run:disabled{opacity:.5}
a.dl{color:var(--ac);margin-right:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500}
.sev,.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.critical,.high,.Breach{background:var(--badbg);color:var(--bad)}.medium,.Atrisk{background:var(--warnbg);color:var(--warn)}.low,.info{background:var(--line);color:var(--mut)}.OK{background:var(--okbg);color:var(--ok)}
.pass{color:var(--ok)}.fail{color:var(--bad)}.not_assessed{color:var(--warn)}.sim{background:#7c3aed;color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;font-size:12px;max-height:260px}.mut{color:var(--mut)}.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.bar{height:8px;background:var(--ac);border-radius:4px}select{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:5px;border-radius:6px}
</style></head><body>
<header><h1>OpenBridge AI</h1><span class="sim">SIMULATED BANKS</span>
<nav id="nav"></nav><span style="flex:1"></span><a href="/studio?tenant=demo-tpp" style="color:var(--ac);font-size:13px">Flow Studio (tenants) ↗</a><span id="status" class="mut"></span><button class="run" id="runBtn">Run Interoperability Audit</button></header>
<main id="main"></main>
<script>
const TABS=['Dashboard','API Auditor','AI Findings','NBG / Regulatory Report'];let tab=0,run=null,findings=[],log=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#nav').innerHTML=TABS.map((t,i)=>`<button data-i="${i}">${t}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.i){tab=+e.target.dataset.i;render()}};
$('#runBtn').onclick=async()=>{$('#runBtn').disabled=true;await fetch('/api/run',{method:'POST'});poll()};
async function poll(){const p=await (await fetch('/api/progress')).json();log=p.progress.map(x=>x.m);$('#status').textContent=p.running?(log.at(-1)||'running…'):'';
 if(p.running){setTimeout(poll,500);render()}else{$('#runBtn').disabled=false;await load()}}
async function load(){const r=await fetch('/api/latest');if(!r.ok){const e=await r.json().catch(()=>({}));run=null;findings=[];$('#main').innerHTML=`<div class="card"><b>${esc(e.error||('HTTP '+r.status))}</b><p class="mut">This page is the NBG console. <a href="/nbg">Open it as NBG</a> or go to the <a href="/studio?tenant=demo-tpp">Flow Studio</a>.</p></div>`;return}run=await r.json();findings=run?await (await fetch('/api/findings')).json():[];render()}
const sev=s=>`<span class="sev ${s}">${s}</span>`;
const SLO_P95=300,SLO_ERR=1,COL=['#2f6fdc','#d97706','#7c3aed'];
const status=(p95,fail)=>fail>0&&fail/ (fail+1)>0&&false?'':(p95>SLO_P95?'Breach':p95>SLO_P95*.85?'Atrisk':'OK');
function dash(){if(!run)return'<div class="card">No run yet. Click <b>Run Interoperability Audit</b>.</div>';
 const s=run.summary,perf=run.performance,req=perf.reduce((a,x)=>a+x.requests,0),fail=perf.reduce((a,x)=>a+x.failed,0),err=req?fail/req*100:0,worst=Math.max(...perf.map(x=>x.p95Ms||x.medianMs||0)),hi=(s.bySeverity.high||0)+(s.bySeverity.critical||0);
 const kpi=(l,v,t,ok)=>`<div class="card kpi"><span class="mut">${l}</span><b>${v}</b><span class="t ${ok?'ok':'bad'}">${ok?'✓':'⚠'} ${t}</span></div>`;
 const banks=run.banks,eps=[...new Set(perf.map(x=>x.endpoint))],W=640,H=250,L=48,B=30,max=Math.max(500,Math.ceil(worst/100)*100),y=v=>H-B-(v/max)*(H-B-12),gw=(W-L)/eps.length,bw=Math.min(36,gw/(banks.length+1));
 const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="p95 latency by endpoint and bank">${[0,1,2,3,4,5].map(i=>{const v=max/5*i;return`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v)} ms</text>`}).join('')}
 ${eps.map((e,i)=>banks.map((b,j)=>{const x=perf.find(p=>p.bank===b.id&&p.endpoint===e);const v=x?.p95Ms||0,bx=L+i*gw+gw/2-(banks.length*bw)/2+j*bw;return`<rect x="${bx}" y="${y(v)}" width="${bw-4}" height="${H-B-y(v)}" rx="3" fill="${COL[j]}"><title>${b.id} ${e}: p95 ${v} ms</title></rect>`}).join('')+`<text x="${L+i*gw+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--mut)">${esc(e.replace('GET ','').replace('/accounts','/acc'))}</text>`).join('')}
 <line x1="${L}" x2="${W}" y1="${y(SLO_P95)}" y2="${y(SLO_P95)}" stroke="var(--bad)" stroke-dasharray="6 4" stroke-width="2"/></svg>`;
 const rows=perf.map(x=>{const st=status(x.p95Ms||x.medianMs,x.failed),lab=x.failed>0&&st==='OK'?'Atrisk':st;return`<div class="ep"><span>${x.bank} · ${esc(x.endpoint)}</span><span>${x.p95Ms} ms · ${x.failed}/${x.requests} failed <span class="pill ${lab}">${lab==='Atrisk'?'At risk':lab==='OK'?'OK':'Breach'}</span></span></div>`}).join('');
 const top=[...findings].sort((a,b)=>({critical:0,high:1,medium:2,low:3,info:4}[a.severity]-{critical:0,high:1,medium:2,low:3,info:4}[b.severity])).slice(0,4);
 const probs=top.map(f=>{const e=f.explanation||{};return`<div class="card prob ${f.severity==='high'||f.severity==='critical'?'':'m'}"><b>${esc(f.title)}</b> <span class="mut">· ${esc(f.bankName)}</span><br>${esc(f.operation)} ${f.jsonPath?'<code>'+esc(f.jsonPath)+'</code>':''}: expected ${esc(f.expected)}, observed ${esc(f.actual)}.<div class="fix"><b>Fix:</b> ${esc(e.recommendedFix||f.recommendedFix)}</div></div>`}).join('');
 const nr=(run.notRun||[]).map(b=>`<div class="card" style="border-left:4px solid var(--warn)"><b>${esc(b.name)}</b> <span class="pill Atrisk">NOT RUN</span><div class="mut">${esc(b.reason)}</div></div>`).join('');
 return`<div class="mut" style="margin-bottom:8px">${s.banks} banks audited · ${s.requestsExecuted} requests · targets are <b>demo values</b>, not regulatory benchmarks</div>${nr}
 <div class="grid">${kpi('Worst p95 latency',worst+' ms','Target under '+SLO_P95+' ms',worst<=SLO_P95)}${kpi('Request failure rate',err.toFixed(1)+'%','Target under '+SLO_ERR+'%',err<SLO_ERR)}${kpi('High-severity findings',hi,'Target 0',hi===0)}${kpi('Tests / checks',s.testsRun,s.findings+' findings total',s.findings===0)}</div>
 <h2>p95 latency vs target</h2><div class="card"><div class="leg mut"><span>${banks.map((b,j)=>`<i style="background:${COL[j]}"></i>${esc(b.name)}`).join('</span><span>')}</span><span><i style="background:var(--bad)"></i>Demo target ${SLO_P95} ms (dashed)</span></div>${svg}</div>
 <h2>Endpoints</h2><div class="card">${rows}</div><h2>Problems and suggested fixes</h2>${probs||'<div class="card">No findings.</div>'}`}
function auditor(){if(!run)return dash();
 return`<div class="card">Bank: <select id="bsel">${run.banks.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div id="aud"></div>`}
function drawAud(){const b=$('#bsel')?.value;if(!b)return;const t=run.tests.filter(x=>x.bank===b),f=findings.filter(x=>x.bank===b);
 $('#aud').innerHTML=`<div class="card"><b>Conformance tests</b><table>${t.map(x=>`<tr><td>${x.testId}</td><td>${esc(x.operation)}</td><td class="${x.status==='not_run'?'not_assessed':x.passed?'pass':'fail'}">${x.status==='not_run'?'NOT RUN':x.passed?'PASS':'FAIL'}</td><td class="mut">${esc(x.note||'')}</td></tr>`).join('')}</table></div>
 <div class="card"><b>Security checks</b><table>${run.security.filter(x=>x.bank===b).map(x=>`<tr><td>${x.testId}</td><td class="${x.status}">${x.status.toUpperCase().replace('_',' ')}</td><td>${esc(x.expected)}</td><td>${esc(x.actual)}</td></tr>`).join('')}</table></div>
 <div class="card"><b>Expected vs actual</b><table><tr><th>Sev</th><th>Rule</th><th>Where</th><th>Expected</th><th>Actual</th></tr>${f.map(x=>`<tr><td>${sev(x.severity)}</td><td>${x.ruleId}</td><td>${esc(x.jsonPath||x.operation)}</td><td>${esc(x.expected)}</td><td>${esc(x.actual)}</td></tr>`).join('')}</table></div>`}
function ai(){if(!run)return dash();return findings.map(f=>{const e=f.explanation||{};return`<div class="card"><b>${f.id}</b> ${sev(f.severity)} ${esc(f.title)} <span class="mut">— ${esc(f.bankName)}</span>
 <div class="mut">${esc(f.operation)} ${f.jsonPath?'· <code>'+esc(f.jsonPath)+'</code>':''} · rule <code>${f.ruleId}</code> · ${esc(f.specRef)}${f.specRefVerified?'':' <span class="tag">ref unverified</span>'}</div>
 <p><b>Verified test output</b> — expected: ${esc(f.expected)} · actual: ${esc(f.actual)}</p>
 <p><b>Explanation</b> <span class="tag">${e.source==='ai'?'AI-generated ('+esc(e.model)+')':'deterministic template'}</span><br>${esc(e.whatWentWrong)}<br><b>Why it matters:</b> ${esc(e.whyItMatters||f.impact)}<br><b>Fix:</b> ${esc(e.recommendedFix||f.recommendedFix)}</p>
 <details><summary class="mut">Evidence</summary><pre>${esc(JSON.stringify(f.evidence,null,2))}</pre></details></div>`}).join('')||'<div class="card">No findings.</div>'}
async function reg(){const rules=[...new Set(findings.map(f=>f.ruleId))];
 const tr=await (await fetch('/api/transform')).json().catch(()=>({}));const r=tr.result||{mappingVersion:'unavailable',deliveries:[],transformationLog:[],reportToBankA:'transformation unavailable (simulators not running)',reportToBankB:''};const da=await (await fetch('/api/docaudit')).json();const dS=da.summary;const rbk=await (await fetch('/api/rulebook')).json();const ev=await (await fetch('/api/evidence')).json();
 return`<div class="card"><b>Downloads</b><br><a class="dl" href="/api/reports/incompatibility.md">Incompatibility Report (.md)</a><a class="dl" href="/api/reports/incompatibility.json">(.json)</a><a class="dl" href="/api/reports/quality.md">Quality Report (.md)</a><a class="dl" href="/api/reports/quality.csv">(.csv)</a><a class="dl" href="/api/reports/doc-audit.md">Documentation Audit (.md)</a></div>
 <div class="card"><b>Documentation audit (offline, no bank contacted)</b> <span class="tag">BOG OpenAPI + TBC portal schemas</span>
 <p>${dS.examplesChecked} published examples checked against their own schemas: <b>${dS.examplesValid} pass, ${dS.examplesInvalid} fail</b> from ${dS.distinctExampleRootCauses} root causes. <span class="mut">Not a defect count or bank score.</span></p>
 <table><tr><th>Where</th><th>What the documents show</th></tr>${da.findings.filter(f=>f.ruleId==='DOC-EXAMPLE'||f.ruleId==='DOC-LOOSE'&&f.bank==='tbc'&&f.op==='accountList').slice(0,8).map(f=>`<tr><td>${f.bank.toUpperCase()} ${f.op}<br><code>${esc(f.jsonPath)}</code></td><td>${esc(f.title)}: expected ${esc(f.expected)}, found ${esc(f.actual)}<div class="mut">${esc(f.classificationLabel)}</div></td></tr>`).join('')}</table></div>
 <div class="card"><b>Cross-bank comparison</b> <span class="mut">(finding counts; ✓ = none)</span><table><tr><th>Rule</th>${(run?run.banks:[]).map(b=>`<th>${b.id}</th>`).join('')}</tr>${rules.map(r=>`<tr><td>${r}</td>${(run?run.banks:[]).map(b=>`<td>${findings.filter(f=>f.bank===b.id&&f.ruleId===r).length||'<span class="pass">✓</span>'}</td>`).join('')}</tr>`).join('')}</table></div>
 <div class="card"><b>Standards rulebook</b> <span class="tag">${rbk.summary.total} rules from the Georgian XS2A / JWS / OAuth guides + Berlin Group</span>
 <p class="mut">${rbk.summary.byStatus.implemented||0} implemented · ${rbk.summary.byStatus.planned||0} planned · ${rbk.summary.byStatus.manual||0} need human/organiser evidence. ${rbk.coverage?`This run evaluated ${rbk.coverage.filter(r=>Object.values(r.banks).some(c=>c.pass+c.fail>0)).length} rules.`:''}</p>
 ${rbk.coverage?`<table><tr><th>Rule</th><th>Level</th>${rbk.banks.map(b=>`<th>${b}</th>`).join('')}</tr>${rbk.coverage.filter(r=>Object.values(r.banks).some(c=>c.fail>0)).map(r=>{const rr=rbk.rules.find(x=>x.id===r.id);return`<tr><td><code>${r.id}</code><div class="mut">${esc(r.title)} · ${esc(rr.source.doc)} ${esc(rr.source.section)}, p.${esc(rr.source.pages)}</div></td><td>${r.level.replace('_',' ')}</td>${rbk.banks.map(b=>{const c=r.banks[b]||{pass:0,fail:0,na:0};return`<td>${c.fail?`<span class="pill Breach">✗ ${c.fail}</span>`:c.pass?'<span class="pass">✓</span>':'<span class="mut">–</span>'}</td>`}).join('')}</tr>`}).join('')}</table>`:'<p class="mut">Run an audit to see per-bank results.</p>'}
 <p><a class="dl" href="/api/reports/rulebook.md">Download rulebook (.md)</a></p></div>
 <div class="card"><b>Manual evidence checklist</b> <span class="tag">NBG reviewers · ${ev.checklist.length} rules software cannot verify alone</span>
 <table><tr><th>Rule</th>${Object.keys((ev.checklist[0]||{banks:{}}).banks).map(b=>`<th>${b}</th>`).join('')}</tr>${ev.checklist.map(r=>`<tr><td><code>${r.id}</code><div class="mut">${esc(r.title)} · ${esc(r.source.doc)} ${esc(r.source.section)}, p.${esc(r.source.pages)}</div></td>${Object.entries(r.banks).map(([b,x])=>`<td><select data-ev="${b}|${r.id}">${ev.statuses.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select>${x.at?`<div class="mut" style="font-size:11px">${esc(x.by)} ${x.at.slice(0,10)}</div>`:''}</td>`).join('')}</tr>`).join('')}</table></div>
 <div class="card"><b>Canonical transformation showcase</b> <span class="tag">synthetic data</span><p>Beta response → canonical <code>${r.mappingVersion}</code> → Alpha format</p>
 ${r.deliveries.map(d=>`<p>${d.accountId}: <b>${d.decision}</b> · missing (not inferred): ${d.missingMandatoryFields.join(', ')||'none'}</p>`).join('')}
 <p><b>To Bank A:</b> ${esc(r.reportToBankA)}<br><b>To Bank B:</b> ${esc(r.reportToBankB)}</p><details><summary class="mut">Transformation log</summary><pre>${esc(JSON.stringify(r.transformationLog,null,1))}</pre></details></div>
 <p class="mut">${run?`Run ${run.runId} · ${run.startedAt} · spec ${run.spec.id} (${run.spec.status}). Simulated institutions: results show the tool works, not real-bank compliance.`:'No runtime audit yet - the documentation audit above works without one.'}</p>`}
async function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i===tab));
 if(tab===3){$('#main').innerHTML='<div class="card mut">Loading…</div>';const t=tab;const html=await reg();if(tab===t){$('#main').innerHTML=html;document.querySelectorAll('[data-ev]').forEach(s=>s.onchange=async()=>{const [bank,ruleId]=s.dataset.ev.split('|');const note=s.value==='outstanding'?'':(prompt('Evidence note (what was checked, document reference)')||'');await fetch('/api/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bank,ruleId,status:s.value,note})});render()});}}else $('#main').innerHTML=[dash,auditor,ai][tab]();if(tab===1){drawAud();$('#bsel').onchange=drawAud}}
load();
</script></body></html>
